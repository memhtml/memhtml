packages:
  - apps/*
  - packages/*
  - tests-integration

# 72 hours, in minutes — matching Dependabot's cooldown.default-days: 3 so the two
# gates state one policy: no release younger than three days installs here, whether a
# human, an agent, or Dependabot asks for it. Security updates arrive through
# Dependabot security PRs, which bypass its cooldown; for a fresh CVE fix pinned
# below the soak window, override per-package with minimumReleaseAgeExclude.
minimumReleaseAge: 4320

# A version whose trust evidence is weaker than an earlier release's (trusted
# publisher yesterday, bare token today) is refused: that shape is what a package
# takeover looks like. The check is publish-date-based, not semver-aware, so old
# transitive pins that predate a project's adoption of provenance read as downgrades
# (pnpm#10622 — semver@5/6 from 2023, chokidar@4.0.3, which its maintainer declined
# to re-release with provenance). ignoreAfter exempts anything older than a year:
# pre-OIDC history cannot carry evidence, while every release young enough to matter
# stays checked. Preferred over trustPolicyExclude, which would grow forever.
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525948

# Transitive dependencies must come from the registry: a sub-dependency declared as a
# git URL, tarball URL, or workspace path smuggles unreviewed code past the lockfile
# diff, so exotic sources are allowed only for DIRECT dependencies this file's owners
# wrote down themselves.
blockExoticSubdeps: true

# The `packageManager` field in package.json is the ONE pnpm pin, and mise installs from
# it (mise.toml's `idiomatic_version_file_enable_tools`). pnpm 11 defaults `pmOnFail` to
# `download`, which means a pnpm whose own version disagrees with that field silently
# downloads and execs the other one — so the version that ran is not the version anything
# declared. `ignore` closes that path rather than trusting the two to agree.
pmOnFail: ignore

# nanoid reaches this repo only through the test toolchain (vitest → vite → postcss), so
# nothing shipped depends on it — but 3.3.16 carries GHSA-2v37-7h3g-55p8 (CVSS 8.2), fixed
# in 3.3.17. postcss asks for `^3.3.11`, so this is a stale resolution rather than a pinned
# dependency, and the selector confines the override to the affected range: once postcss or
# vite resolves 3.3.17+ on its own, this stops applying and can be deleted.
# `mise run security:osv` is what notices if it ever stops being true.
# The replacement stays inside 3.x on purpose: nanoid 4 dropped CommonJS, and postcss
# requires it, so an unbounded `>=3.3.17` resolves to the 6.x line and breaks the very
# toolchain this dependency serves (measured — it resolved 6.0.1).
overrides:
  nanoid@<3.3.17: "^3.3.17"
  # tmp reaches this repo only through the docs toolchain (@lhci/cli directly, and
  # external-editor inside inquirer). 0.0.33 and 0.1.0 carry GHSA-ph9p-34f9-6g65
  # (HIGH, symlink directory traversal) and GHSA-52f5-9888-hmc6 (LOW); both are fixed
  # in 0.2.6, and the 0.2.x API keeps the fileSync/dirSync surface those consumers
  # call. Range-scoped like nanoid above: once the parents resolve 0.2.6+ on their
  # own, this stops applying and can be deleted.
  tmp@<0.2.6: "^0.2.6"
  # uuid 8.3.2 sits under @lhci/cli. CVE-2026-41907 is fixed in 11.1.1; uuid 9-11
  # kept the named-export CommonJS surface lhci uses (verified: the budget gate runs
  # green under this override). Same delete-when-stale rule as the two above.
  uuid@<11.1.1: "^11.1.1"
  # NOT overridden: extract-zip 2.0.1 (GHSA-jmr9-qjv8-65gv, via @puppeteer/browsers)
  # has no fixed release yet. It runs only at browser-download time in the docs
  # toolchain, never in anything published. Revisit when a fix ships.

# Effect v4 is pre-release: every Effect package moves as one pinned, tested set, and the
# three versions here are always the same string.
catalog:
  effect: 4.0.0-beta.107
  "@effect/platform-node": 4.0.0-beta.107
  "@effect/vitest": 4.0.0-rc.109
  fast-check: 4.9.0

allowBuilds:
  # Every entry here is an optional NATIVE accelerator behind a pure-JS fallback that is
  # sufficient for this repo, so each is denied. pnpm refuses to install while any of them
  # is undecided, which is why absent packages must be answered rather than ignored.
  #
  # msgpackr-extract: reached through effect -> msgpackr.
  #
  # @mongodb-js/zstd and node-liblzma: optional deps of just-bash, the pure-JS sandbox
  # backend @memhtml/consolidator runs its eve agent in. They accelerate zstd/xz decompression
  # inside that sandbox's virtual filesystem. The consolidator puts only plain-text JSONL
  # transcripts in there and never decompresses anything, so neither is on any path it
  # takes; both also want node-gyp, which no CI image here provides.
  #
  # esbuild: reached through astro -> vite. Its install script only validates the platform binary
  # and swaps the JS launcher in node_modules/esbuild/bin for the native one. The JS API resolves
  # @esbuild/<platform>-<arch> itself at call time, and that is the only path Astro and Vite take,
  # so denying the script leaves esbuild.transform() and `astro build` working — measured, both
  # exit 0. Denied like every other native accelerator here.
  "@mongodb-js/zstd": false
  msgpackr-extract: false
  node-liblzma: false
  esbuild: false
