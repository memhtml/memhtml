# Git hooks via lefthook, installed by `mise run install` (or `mise run hooks:install`).
#
# Every job goes through `mise exec` / `mise run`, so the tool that runs is the version
# this repo pins — biome 2.5.10 from node_modules/.bin (reached via mise.toml's `_.path`),
# betterleaks 1.7.4 from mise. Never a bare `biome`, whose resolution depends on the
# committer's shell.
#
# The split: pre-commit is the fast, file-scoped pass; pre-push is the whole-repo
# gates that catch what a per-file pass cannot. The test tiers are deliberately absent —
# ~1850 unit tests across 13 packages, and the integration tier runs one file at a time
# with 180-second timeouts. `mise run check` is CI's job, and CI is where it gates.
#
# Bypass with `--no-verify` in a genuine emergency; CI still refuses.

commit-msg:
  jobs:
    - name: conventional-commit
      # Conventional Commits, plus the three prefixes this repo actually uses beyond the
      # standard set: `spec` (the spec/memhtml.symspec.json requirements ledger gets its
      # own commits), `merge`, and `deps` — which is what `.github/dependabot.yml` sets as
      # its `commit-message.prefix`, so the two files have to name the same type or a
      # rebased Dependabot commit cannot pass a hook its own config guarantees it will fail.
      # None of the three is a release-please type, which is the point: they do not move a
      # version, so a dependency bump only ships when a maintainer promotes it with fix:/feat:.
      run: |
        head -1 {1} | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|spec|merge|deps)(\(.+\))?!?: .+' \
          || { echo "commit message must follow Conventional Commits: <type>(<scope>): <subject>"; exit 1; }

pre-commit:
  parallel: true
  jobs:
    - name: biome
      # The extension set mirrors biome.json's files.includes, and the pair is gated by
      # tests-integration/tests/lint-surface.test.ts rather than left as a convention. Either
      # direction of drift breaks the loop: an extension `mise run lint` checks and this job does
      # not format arrives unformatted at a gate that refuses it, and an extension this job
      # rewrites that no include names is edited by a tool no gate reads.
      glob: "*.{ts,mjs,json}"
      # --no-errors-on-unmatched because biome.json excludes spec/*.symspec.json and
      # every dist/, so a staged set can legitimately contain nothing biome handles —
      # which is not an error worth blocking a commit over.
      run: mise exec -- biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: dprint-md
      # `*.md` matches by basename at any depth, exactly like the biome job's
      # `*.{ts,json}` above — measured: a staged docs/deep/nested.md matches. Do not
      # "fix" this to `**/*.md`, which stops matching root-level files (also measured:
      # a staged README.md falls out of the set).
      glob: "*.md"
      # Markdown is dprint's (textWrap: never); biome has no Markdown formatter. The
      # excludes in dprint.json exempt the generated files (AGENTS.md, CHANGELOG.md), and
      # --allow-no-files is dprint's --no-errors-on-unmatched: without it a staged set
      # containing only exempted files exits 14 (measured on `dprint fmt AGENTS.md`).
      run: mise exec -- dprint fmt --allow-no-files {staged_files}
      stage_fixed: true
    - name: leak-staged
      # Scans only the staged diff, which is what makes it fast enough for every commit;
      # the full-history sweep is pre-push and CI. This is the ONE scanner that gates
      # rather than reports: a staged secret must never become a commit, and unlike the
      # CI scans there is no SARIF upload here to protect from a non-zero exit.
      run: mise exec -- betterleaks git --staged --no-banner --redact

pre-push:
  parallel: true
  jobs:
    - name: lint
      run: mise run lint
    # typecheck and smoke-package are SERIAL, inside one group, and the reason is turbo. Both reach
    # `@memhtml/docs#build` — typecheck through `turbo run typecheck` (docs typecheck dependsOn build),
    # smoke-package through `package:assemble`'s `turbo run build` — and two turbo processes started
    # side by side do not share one task graph, so on a cold cache each ran its own `astro build`
    # into the same `apps/docs/dist`. One build clears `dist/.prerender` while the other is still
    # rendering, and the second dies with `Cannot find module dist/.prerender/chunks/llms_*.mjs`.
    # Measured 2026-09-05: the first push after a change failed this way twice in a row and passed on
    # retry both times, because the retry found a warm cache; two concurrent `astro build`s in one
    # checkout reproduce it directly. Serial, the second job hits the cache the first one wrote, so
    # the cost is the ~45 s typecheck no longer overlapping the smoke rather than a second build.
    - group:
        parallel: false
        jobs:
          - name: typecheck
            # Typecheck depends on build in turbo, so this is also the cheapest proof that the
            # project-reference graph still compiles before anything reaches origin.
            run: mise run typecheck
          - name: smoke-package
            # The published artifact, installed and driven. ~60s credential-free, ~105s with `--live`, which
            # additionally spends real Bedrock tokens on the three edges nothing else can reach from an
            # install: embeddings, the sleep phases that call a model, and the consolidator distilling a
            # transcript through eve.
            #
            # Live WHEN A CREDENTIAL IS PRESENT, and the fallback says so on stderr rather than quietly
            # proving less — a push from a machine with no Bedrock access should still gate the artifact, and
            # should not be able to mistake the smaller gate for the larger one.
            #
            # This is the slowest hook in the repo by an order of magnitude. `--no-verify` skips it; CI runs
            # the credential-free half on every PR regardless.
            run: |
              if [ -n "$AWS_BEARER_TOKEN_BEDROCK" ] || { [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; }; then
                mise run package:smoke:live
              else
                echo "pre-push: no Bedrock credential, running the credential-free smoke — the embedder, the model, and the consolidator go unproven" >&2
                mise run package:smoke
              fi
