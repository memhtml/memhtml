# mise is the stable command surface for humans, agents, and CI. `mise run check` is
# the definition of done, and CI runs that same task against the binaries mise.lock
# pins — one toolchain declaration, one command definition.
#
# Every task DELEGATES to the pnpm script that drives turbo. turbo.json stays
# authoritative for the task graph: dependsOn, outputs, the content cache, and the two
# backwards #test edges (@memhtml/html#test needs @memhtml/index#build,
# @memhtml/cli#test needs @memhtml/mcp#build). No task here carries sources/outputs/
# cache, because mise's freshness oracle is mtime and turbo's is a content hash — a
# mise-level skip would preempt turbo's per-package hashing and, after a checkout or
# cache restore that rewrites mtimes, skip work turbo would rebuild. `depends` is used
# only where the members are genuinely independent (security), never to re-express a
# tier ordering turbo already owns.
#
# There is deliberately no value-bearing [env] var. A credential-presence test deletes
# the AWS vars and then asserts the ambient environment is credential-free
# (apps/cli/tests/consolidator-wiring.test.ts), effect/Config snapshots process.env at
# module load, and the sandbox backend switches on VERCEL. The integration tier sets
# MEMHTML_EMBED=off / MEMHTML_LLM=off itself, which is what keeps the gate secret-free.
min_version = "2026.4.16" # raw_args

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "macos-arm64"]

[tools]
# pnpm is declared ABOVE node, and the order is load-bearing. mise prepends each tool's
# directory to PATH in declaration order, and node's own bin holds a `pnpm` symlink to
# corepack/dist/pnpm.js wherever `corepack enable` has run — so with node first, every
# pnpm call goes through corepack and this pin is inert. Measured: pnpm below node
# resolves to installs/node/24/bin/pnpm, pnpm above it resolves to its own
# installs/pnpm/<version> directory. Keeping corepack out of the path matters beyond
# tidiness: the Node TSC voted to stop distributing it (nodejs/TSC#1697), Node 25+ does
# not bundle it, and pnpm 11 no longer reads COREPACK_ENABLE_STRICT.
#
# This version and package.json's `packageManager` must agree, and `mise run tools:verify`
# is what makes that a checked invariant rather than a convention.
pnpm = "11.21.0"
node = "24"                              # the only node declaration; engines says >=24
# A `latest` below is not "whatever today brings": mise.lock pins the concrete version,
# checksum, URL, and provenance, and `mise run tools:bump` is the only thing that moves
# them. So a clone resolves what the lock says, and refreshing a scanner is a reviewable
# diff rather than a silent change between two runs.
lefthook = "latest"                      # git hooks; wired by `mise run install`
"aqua:betterleaks/betterleaks" = "1.7.4" # secret scanner
osv-scanner = "latest"                   # vulnerability scan over pnpm-lock.yaml
semgrep = "latest"                       # SAST
syft = "latest"                          # SBOM generator (CycloneDX); grype scans its output
grype = "latest"                         # vulnerability scan over the syft SBOM
trivy = "latest"                         # filesystem misconfiguration + vulnerability scan
# The docs site renders its figures at build time through astro-d2, which shells out to this
# binary — so a docs build on a machine without it produces a page with a missing figure rather
# than an error. Pinned exactly, not `latest`: 0.7.1 is the release that added the ASCII
# renderer, and the same .d2 source has to emit both the site's SVG and the monospace figure
# GitHub can display, since GitHub renders Mermaid and does not render D2 at all.
"aqua:terrastruct/d2" = "0.7.1"          # diagram renderer for apps/docs
# External-link checker for the built docs site, used ONLY by the scheduled `links` workflow. It is
# not in `check` and must not be: an outbound 404 appears when somebody else edits their site, so
# gating on it would fail whichever commit happened to be pushed that day.
lychee = "latest"

[env]
# Puts the workspace's own binaries on PATH so a lefthook job reaching for `biome` gets
# the pinned 2.5.6 from devDependencies rather than needing a fifteenth declaration
# under [tools]. PATH only — see the header on why no value-bearing var is set.
_.path = ["{{config_root}}/node_modules/.bin"]

# --- install ------------------------------------------------------------------------

[tasks."tools:verify"]
description = "Fail if mise.toml's pnpm pin and package.json's packageManager disagree"
# Plain node, no dependency: this has to be able to run before an install.
run = "node scripts/verify-pnpm-pin.mjs"

[tasks."tools:bump"]
description = "Re-resolve every `latest` tool in mise.lock, leaving mise.toml alone"
# Review the mise.lock diff — it is the record of which binaries the fleet now runs.
run = "mise lock --bump"

[tasks.browsers]
description = "Fetch the pinned Chromium the accessibility and budget gates drive"
# Playwright 1.62 ships NO install script, so `pnpm install` never fetches a browser — measured, and
# it is why `allowBuilds` needed no new entry for it. Acquiring it is therefore an explicit step, and
# it belongs in `install`: `mise run check` runs both browser gates, so a clone that installed
# without this would fail the gate for want of a binary rather than for a defect.
#
# The download lands in a per-user cache (~/.cache/ms-playwright on Linux) keyed by Playwright's
# build number, so this is a no-op once the version is present, and CI restores that path from a
# cache before installing. `chromium` is Chrome for Testing: one binary serves axe through Playwright
# and Lighthouse through CHROME_PATH, so both gates measure the same engine as each other and as CI.
run = "pnpm --filter @memhtml/docs exec playwright install chromium"

[tasks.install]
description = "Install dependencies from the lockfile + wire the git hooks + fetch the browser"
depends = ["tools:verify"]
run = ["pnpm install --frozen-lockfile", "lefthook install", "mise run browsers"]

[tasks."install:ci"]
description = "Reproducible install for CI — fails on lockfile drift, installs no hooks"
# No `browsers` here, unlike `install`: three workflows call this and only `check` drives a browser,
# so folding the download in would cost the pages and links jobs ~130 MB for nothing. `check.yml`
# runs `browsers` as its own step, behind the cache that makes it a no-op.
depends = ["tools:verify"]
run = "pnpm install --frozen-lockfile"

# --- the gate -----------------------------------------------------------------------

[tasks.check]
description = "The definition of done: lint, typecheck, tests, integration, eval, a11y, budget"
raw_args = true
run = "pnpm check"

[tasks.build]
description = "tsc -b across the project-reference graph"
raw_args = true
run = "pnpm build"

[tasks.lint]
description = "biome, per package"
raw_args = true
run = "pnpm lint"

[tasks.format]
description = "Apply biome formatting across the repo"
# No `dir`: mise runs tasks from config_root, and the `.` in `biome check --write .` IS
# the write set — a dir would silently narrow or widen it.
raw_args = true
run = "pnpm format"

[tasks.typecheck]
description = "Strict tsc --noEmit per package, tests included"
raw_args = true
run = "pnpm typecheck"

[tasks.test]
description = "Every package's unit and property suites (turbo builds first)"
raw_args = true
run = "pnpm test"

[tasks."test:integration"]
description = "Cross-package contracts over a real repo and a real database"
raw_args = true
run = "pnpm test:integration"

[tasks."test:eval"]
description = "The refusable discrimination gate, fake embedder"
raw_args = true
run = "pnpm test:eval"

[tasks."test:a11y"]
description = "WCAG 2.2 AA over four pages of the built docs site, plus the probes axe lacks"
raw_args = true
run = "pnpm test:a11y"

[tasks."test:budget"]
description = "Lighthouse category floors and the byte budget over the built docs site"
raw_args = true
run = "pnpm test:budget"

[tasks.spell]
description = "Spell-check the docs site's authored prose against the project dictionary"
# Also reached by `mise run lint`: @memhtml/docs's own lint script ends with this, so the gate needs
# no separate tier. This task exists to run it alone while editing prose.
raw_args = true
run = "pnpm --filter @memhtml/docs spellcheck"

[tasks."gen:fixture"]
description = "Write a browsable fixture corpus: mise run gen:fixture --out DIR [--seed N]"
# Trailing args land at the end of the `&&` chain, which is the gen-fixture.js that
# parses --out / --seed / --size / --probes / --dry-run.
raw_args = true
run = "pnpm gen:fixture"

[tasks.agents-doc]
description = "Regenerate AGENTS.md from the BUILT CLI's own command table"
# The build must precede the invocation: agents-doc reads the compiled COMMANDS array,
# so regenerating against stale dist reproduces the old doc and hides the drift.
run = "pnpm --filter @memhtml/cli build && node apps/cli/dist/bin.js agents-doc"

# --- the published artifact ----------------------------------------------------------

[tasks."package:assemble"]
description = "Assemble the twelve workspace packages into ONE publishable `memhtml` in dist-package/"
# Builds first, unconditionally: the script copies each package's `dist/`, so a stale or missing
# one is silently published rather than caught. It refuses outright when a `dist/` is absent, and
# building here means that refusal never fires for a reason the caller could have avoided.
run = "mise run build && node scripts/assemble-package.mjs"

[tasks."package:pack"]
description = "Assemble, then `npm pack` the single package into dist-package/"
depends = ["package:assemble"]
dir = "{{config_root}}/dist-package"
run = "npm pack"

[tasks."package:smoke"]
description = "Install the assembled package into a temp dir and drive every subsystem through it"
# Deliberately NOT in `mise run check`: this resolves the twelve external dependencies from the npm
# registry, and check is offline and credential-free by construction. CI runs it as its own job, and
# the publish job runs it on the tag. It is the only tier whose subject is the published artifact
# rather than the workspace.
depends = ["package:assemble"]
run = "node scripts/smoke-package.mjs"

# --- git hooks ----------------------------------------------------------------------

[tasks."hooks:install"]
description = "Install the lefthook git hooks (commit-msg / pre-commit / pre-push)"
run = "lefthook install"

[tasks."hooks:uninstall"]
description = "Remove the lefthook git hooks"
run = "lefthook uninstall"

# --- security -----------------------------------------------------------------------
# Report-only by design: each scanner always emits SARIF and always exits 0, and the
# gating happens through GitHub code scanning. A scanner that exits non-zero kills the
# workflow step before the SARIF uploads, which loses the finding detail that made the
# scan worth running. The one place a scanner DOES gate is lefthook's pre-commit leak
# job, because a staged secret must never become a commit.

[tasks."security:osv"]
description = "Vulnerability scan of pnpm-lock.yaml via osv-scanner (SARIF, report-only)"
run = """
mkdir -p .sarif
osv-scanner scan source --lockfile=pnpm-lock.yaml \
  --format=sarif --output=.sarif/osv.sarif || true
"""

[tasks."security:semgrep"]
description = "SAST via semgrep p/auto + p/owasp-top-ten (SARIF, report-only)"
run = """
mkdir -p .sarif
semgrep scan \
  --config p/auto \
  --config p/owasp-top-ten \
  --sarif --output=.sarif/semgrep.sarif \
  --metrics=off || true
"""

[tasks."security:leaks"]
description = "Secrets sweep over git history via betterleaks (SARIF, report-only)"
run = """
mkdir -p .sarif
betterleaks git . -f sarif -r .sarif/betterleaks.sarif --exit-code=0
"""

[tasks."security:sbom"]
description = "CycloneDX SBOM of the workspace via syft, then grype scans it (SARIF, report-only)"
# One syft pass feeds both outputs: the SBOM artifact CI uploads, and the input grype
# scans. Scanning the SBOM instead of re-walking the tree keeps the two views of the
# dependency set identical by construction.
run = """
mkdir -p .sarif .sbom
syft scan dir:. --source-name memhtml -o cyclonedx-json=.sbom/sbom.cyclonedx.json
grype sbom:.sbom/sbom.cyclonedx.json -o sarif --file .sarif/grype.sarif || true
"""

[tasks."security:trivy"]
description = "Filesystem vuln + misconfig scan via trivy (SARIF, report-only)"
run = """
mkdir -p .sarif
trivy fs . --scanners vuln,misconfig --severity HIGH,CRITICAL \
  --format sarif --output .sarif/trivy.sarif --exit-code 0
"""

[tasks.security]
description = "All scanners in parallel: osv + semgrep + leaks + sbom/grype + trivy (SARIF under .sarif/)"
# Genuinely independent — none of the five builds anything or reads another's output
# (sbom/grype chain internally within their one task).
depends = ["security:osv", "security:semgrep", "security:leaks", "security:sbom", "security:trivy"]

# --- the binary ---------------------------------------------------------------------
# `raw = true` on both: every command writes exactly ONE JSON envelope to stdout and
# nothing else, `memhtml apply -` and `memhtml exec` read stdin, and `serve mcp` uses
# stdout as the JSON-RPC stream. mise's default line-buffered, task-prefixed output
# would corrupt all three.

[tasks.cli]
description = "Run the memhtml CLI from dist: mise run cli search 'query'"
hide = true
raw = true
raw_args = true
run = "node apps/cli/dist/bin.js"

[tasks.serve]
description = "Run the memhtml-mcp stdio server over this repo"
raw = true
run = "node apps/cli/dist/bin.js serve mcp"

# The docs site. Both delegate to the package's own scripts, so turbo keeps ownership of the task
# graph: `docs:build` through turbo builds @memhtml/cli first (build.dependsOn = ["^build"]), which
# the generated reference needs because @memhtml/* exports resolve only to ./dist.
[tasks."docs:dev"]
description = "Run the docs site dev server"
raw = true
raw_args = true
run = "pnpm --filter @memhtml/docs dev"

[tasks."docs:build"]
description = "Build the docs site into apps/docs/dist"
raw_args = true
run = "pnpm turbo run build --filter=@memhtml/docs"

# Four of the site's figures are also the README's. This renders those `.d2` sources through d2's ASCII
# renderer and rewrites the fenced blocks between the README's `<!-- figure:NAME -->` markers, because
# GitHub renders Mermaid natively and D2 not at all — a `.d2` fence there would show raw source. The
# output is committed and `apps/docs/tests/figures.test.ts` runs the same script with `--check`, so the
# drift gate is a test rather than a pipeline step, exactly as it is for AGENTS.md. Not a turbo task:
# it reads no package's dist and writes a repo-root file that no package owns.
[tasks."figures:readme"]
description = "Regenerate the README's ASCII figures from the site's own .d2 sources"
raw_args = true
run = "pnpm figures:readme"
[tasks."docs:links"]
description = "Check every EXTERNAL link in the built docs site (reports, never gates)"
# Not part of `check`, and the workflow that runs it on a schedule says why: an outbound link rots
# when its owner changes their site, which is not a property of the commit being pushed. Internal
# links are a different question and DO gate — starlight-links-validator fails the build on one.
#
# `--offline` is absent on purpose: the whole point is the network. `--include-fragments` follows
# `#anchor` into the fetched page, which is where a link to a renamed section on someone else's docs
# shows up. The exit code is deliberately preserved here so a human running it sees the failure; the
# workflow is what declines to gate.
run = """
mise run docs:build
lychee --config lychee.toml 'apps/docs/dist/**/*.html'
"""
