# Dependabot: weekly grouped updates for the pnpm workspace and the pinned actions.
#
# What Dependabot deliberately does NOT own here:
# - mise.lock — scanners and toolchain move through `mise run tools:bump`, where the
#   lock diff is the review artifact.
# - The 3-day (4320-minute) pnpm `minimumReleaseAge` in pnpm-workspace.yaml still
#   applies to what Dependabot proposes; a fresh release inside the soak window will not
#   resolve, which is the intended supply-chain tradeoff (see that file's
#   `minimumReleaseAgeExclude` note for the per-package escape hatch).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Los_Angeles
    # The same 72-hour soak pnpm's minimumReleaseAge enforces, stated on Dependabot's
    # side: it will not even PROPOSE a release younger than this, so a
    # compromised-then-yanked version never reaches a PR. Security updates bypass
    # cooldown by design.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    commit-message:
      # `deps:` is not a release-please type, so dependency bumps do not by themselves
      # force a release; a maintainer promotes one with fix:/feat: when it matters.
      prefix: "deps"
    labels:
      - dependencies
    ignore:
      # `typescript` is two roles under one name: the compiler `tsc -b` runs (7.x at the
      # root) and the in-process parser `apps/docs/src/loaders/repo-sources.ts` calls (6.x
      # in that package). A major that moves both at once is not installable there, on two
      # counts measured against 7.0.2 on 2026-08-14: the main entry exports only
      # `{ version, versionMajorMinor }`, with parsing behind `typescript/unstable/sync`'s
      # out-of-process `API`; and `@astrojs/check@0.9.10`, which IS that package's
      # `typecheck` task, declares `peerDependencies: { typescript: "^5.0.0 || ^6.0.0" }`.
      # Lift this when the loader no longer needs an in-process AST and astro check accepts
      # the major — a compiler bump is then a deliberate change, not a weekly one. Minor and
      # patch updates still flow.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # `highlight.js` relevance scores ARE the fence-language detector's confidences, so any
      # grammar change moves which fences get `data-lang` stamped. `packages/html/src/detect.ts`
      # ships a threshold swept by `external-evals` over a 332-snippet corpus at a 95%-precision
      # floor, and this repo holds neither that corpus nor that harness — so a bump cannot be
      # accepted here without re-running the eval and re-deriving the threshold. Measured against
      # 11.12.0 on 2026-08-18: `slice:example-service/mise.toml@42+9` fell 0.5406 -> 0.1993 and
      # stopped stamping `toml`, and one python row stopped stamping too, both losses in coverage
      # with no evidence about precision. Minor and major are therefore a deliberate decision that
      # re-runs the eval. Patch stays open so a security fix can still reach a PR; the pin
      # assertion in `packages/html/tests/detect.test.ts` gates whether it may land.
      - dependency-name: highlight.js
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      # `just-bash` 3.6.0 depends on `guarded-fetch` 0.1.3 exactly, and that release pins `undici`
      # 7.29.0 exactly. undici 7.29.0 carries three high advisories (GHSA-w293-vg96-wgc3,
      # GHSA-rfgv-xxqx-mfg5, GHSA-xjj6-f33q-929c), the last fixed only in 7.30.1, and an exact pin
      # two levels down reaches every installer of the published package, where no override of
      # ours applies. The newest `guarded-fetch`, 0.1.6 (2026-10-15), still pins 7.30.0. Checked
      # 2026-10-26, when 3.6.0 was the newest `just-bash`; `apps/cli` stays on 3.4.2, whose
      # `undici` range resolves 7.30.1. Lift this when a `just-bash` release resolves an undici at
      # or above 7.30.1. A 3.7 or later still reaches a PR, where dependency-review checks it.
      - dependency-name: just-bash
        versions: ["3.6.x"]
      # `starlight-md-txt` 0.2.0 (2026-10-23) moves the site root's raw Markdown twin from `/.md` to
      # `/index.md` and starts rewriting links inside the twins. `apps/docs/src/lib/llms-pages.ts`
      # reads the root twin at `/.md`, so the docs build fails on 0.2.0 (checked 2026-10-26), and
      # `agent-surface.ts`, `base-raw-links.ts` and their tests assume the same route. Moving to
      # 0.2 is a docs-site change with its own PR, not a weekly bump; 0.1.x patches still flow.
      - dependency-name: starlight-md-txt
        versions: ["0.2.x"]
    groups:
      # Effect v4 is pre-release and `pnpm-workspace.yaml`'s catalog holds its four packages at ONE
      # string, so they move together or the catalog is a state it refuses. This group carries NO
      # `update-types`, and that omission is the whole mechanism: a prerelease-to-prerelease move is
      # not classified as major, minor or patch, so a group naming those three does not match one and
      # Dependabot falls back to a PR per package. Observed 2026-08-25 on rc.109 -> rc.111: four
      # separate PRs (#68-71) against a group that named all three types. A `patterns`-only group
      # matches every update type, which is what keeps the set in one reviewable PR.
      #
      # `tests-integration/tests/catalog.test.ts` is the backstop either way — it fails on a catalog
      # whose entries disagree, so a split PR goes red rather than shipping a mixed set.
      effect:
        patterns:
          - effect
          - "@effect/*"
      # Everything else minor/patch rides in one weekly PR so review cost stays flat.
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 3
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        update-types:
          - minor
          - patch
