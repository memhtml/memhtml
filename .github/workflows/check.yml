# One job: the definition of done. `mise run check` = `pnpm check` = turbo run lint
# typecheck test test:integration test:eval — credential-free by construction (eval
# defaults to --mode fake; integration tests set MEMHTML_EMBED=off / MEMHTML_LLM=off
# themselves), so this pipeline needs no secrets.
#
# The toolchain is declared once, in mise.toml, and pinned by checksum in mise.lock.
# There is deliberately no node-version here and no corepack: mise-action installs node
# and pnpm from those two files — and because a mise.lock is present it installs
# `--locked`, so CI resolves the same binaries a developer resolved. The command is the
# same task definition too, which is the whole point: nothing about this job can drift
# from `mise run check` on a laptop.
name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      # Ask pnpm where its store is rather than hardcoding a path — a path that is wrong
      # caches nothing and says nothing about it. Runs after mise-action because that is
      # what puts pnpm on PATH.
      - run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      # pnpm's content-addressable store, keyed on the lockfile. mise-action caches
      # mise's own tools; the store is separate, and without this every run re-downloads
      # every dependency.
      - uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      # The Chromium the accessibility and performance gates drive. It lives in a per-user cache rather
      # than in node_modules, so the pnpm store cache above cannot hold it, and Playwright 1.62 ships
      # no install script, so nothing fetches it implicitly. Restored before `mise run browsers` so
      # that step is a no-op on a hit rather than a ~130 MB download per run.
      #
      # Keyed on the lockfile, which is the only file that can move the Playwright version, with no
      # `restore-keys`: a partial hit would seed the directory with some OTHER build number, and
      # Playwright would download the right one anyway while the stale one stayed on disk for good.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: mise run install:ci
      # Only this workflow needs it, which is why it is a step here rather than part of `install:ci` —
      # the pages and links jobs install the same dependencies and drive no browser.
      - run: mise run browsers
      - run: mise run check
