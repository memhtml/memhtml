# OpenSSF Scorecard: supply-chain posture assessment, published to the Security tab and
# to scorecard.dev (which is what the README badge reads). Runs on main pushes, branch
# protection changes, and weekly — the score moves when the ecosystem's expectations
# move, not only when this repo does.
name: scorecard
on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "30 7 * * 1"
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF
      id-token: write # publish_results signs the result for scorecard.dev
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard.sarif
          category: scorecard
