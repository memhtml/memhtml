# OpenSSF Scorecard: supply-chain posture assessment, published to the Security tab and
# to scorecard.dev (which is what the README badge reads). Runs on main pushes, branch
# protection changes, and weekly — the score moves when the ecosystem's expectations
# move, not only when this repo does.
name: scorecard
on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "30 7 * * 1"
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF
      id-token: write # publish_results signs the result for scorecard.dev
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scorecard.sarif
          category: scorecard
