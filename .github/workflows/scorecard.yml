# OpenSSF Scorecard: supply-chain posture assessment, published to the Security tab and
# to scorecard.dev (which is what the README badge reads). Runs on main pushes, branch
# protection changes, and weekly — the score moves when the ecosystem's expectations
# move, not only when this repo does.
name: scorecard
on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "30 7 * * 1"
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF
      id-token: write # publish_results signs the result for scorecard.dev
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: scorecard.sarif
          category: scorecard
