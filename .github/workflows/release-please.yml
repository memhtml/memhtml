# Releases are cut by release-please from Conventional Commit subjects and published to
# npm by the publish job below, authenticated with OIDC trusted publishing — no npm token
# lives in any secret. RELEASING.md documents the flow, the bootstrap, and the failure
# signatures.
#
# One workflow, on purpose: a second workflow keyed on `release: [published]`
# would never fire, because GitHub does not start workflow runs from events raised by the
# default GITHUB_TOKEN, and release-please tags with that token.
name: release-please

on:
  push:
    branches: [main]
  # Retry a publish against a tag that already exists. A publish can fail for a reason that
  # has nothing to do with the bytes — a missing tool on the runner did exactly that on the
  # first real release — and without this the only way to retry is to cut another version.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. memhtml-v0.2.0"
        required: true
        type: string

# Least privilege at the top, granted per job below. `id-token: write` in particular must
# never reach the release-please job — only the step that publishes needs an OIDC token.
permissions: {}

jobs:
  release-please:
    # Skipped on a manual dispatch: the tag already exists and nothing needs computing.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # One package at the repository root, so these are the plain single-package outputs.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # @v5, not the @v4 the action's own README still shows: v4 runs on the deprecated
      # node20 runtime. The version lives in fifteen places and release-please updates all
      # of them from this one root manifest: the root `package.json`, the twelve workspace
      # manifests through `json` extra-files, and the two source constants annotated with
      # `x-release-please-version` (apps/cli/src/commands.ts, apps/mcp/src/server.ts).
      # The workspace manifests still move even though none of them publishes and the
      # bundle carries none of them: it is bookkeeping, so a reader opening one sees which
      # release that code belongs to.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  publish:
    needs: release-please
    # `always()` so a manual dispatch runs it even though release-please was skipped.
    if: always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token npm exchanges for a short-lived publish credential. This is the
      # whole reason there is no NPM_TOKEN secret anywhere in this repo.
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.assets.outputs.version }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      tag: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      # The TAG, not the branch: `main` has already moved on by the time this runs, and
      # the bytes that get published have to be the bytes that were released.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          persist-credentials: false

      # The toolchain mise.lock pins, and this job genuinely needs it: `pnpm check` builds the
      # docs site, astro-d2 shells out to the `d2` binary, and d2 is a mise tool. Without this
      # the docs build dies in `astro:config:setup` and the release cannot publish — which is
      # exactly what happened on the first real release.
      #
      # BEFORE setup-node, and the order is load-bearing. Both prepend to PATH, so whichever
      # runs last wins, and setup-node's node is the one that must: it writes the OIDC .npmrc
      # and its npm is the one that has to run the publish.
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      # No `version:` — action-setup ERRORS when the workflow pins a version while
      # package.json's `packageManager` also pins one. That field is the single source of
      # truth, and it must be >= 11.1.3: earlier pnpm sends the literal
      # `${NODE_AUTH_TOKEN}` that setup-node writes as a bearer token and 404s before
      # OIDC can engage (pnpm#11513).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # `registry-url` is what writes the .npmrc that scopes the registry, and OIDC never
      # engages without it.
      #
      # NODE_AUTH_TOKEN is deliberately NOT set — not even to an empty string. npm falls
      # back to OIDC only when no static credential resolves, and an empty string is
      # still a credential.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # The Playwright Chromium the accessibility gate drives; a no-op when the version is cached.
      - run: pnpm exec playwright install chromium --with-deps
        working-directory: apps/docs

      # The full gate again, on the tag. The release PR's bot-created runs wait for a
      # maintainer to approve them and then pass before merge (see RELEASING.md).
      # Keep this check too: it proves the actual tag being published.
      - run: pnpm check

      # Assemble the one publishable package from the twelve workspace trees, then INSTALL
      # it and drive every subsystem through the installed binary. `pnpm check` proves the
      # workspace works and is structurally blind to what npm serves — three run-time
      # assets shipped broken under exactly that blindness. This is the only step whose
      # subject is the artifact.
      #
      # The pnpm script rather than the mise task, even though mise is present: the task is a
      # thin delegation to this script, and calling it directly keeps `npm` resolution in
      # setup-node's hands, which is the one that holds the OIDC `.npmrc`.
      - run: pnpm package:smoke

      # npm packs once inside this script. Retry checks registry integrity and recovers
      # the published tarball if rebuilding changed its bytes; it never publishes twice.
      - name: Stage release assets
        id: assets
        env:
          RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
        run: node scripts/release-assets.mjs stage dist-package "$RUNNER_TEMP/release-assets" "$RELEASE_TAG" --registry

      # Publish the packed file, with the same trusted publishing identity as before.
      # --provenance is unnecessary: npm adds it automatically for public OIDC publishes.
      - name: Publish the packed tarball
        if: steps.assets.outputs.publish == 'true'
        env:
          TARBALL: ${{ steps.assets.outputs.tarball }}
        run: npm publish "$TARBALL" --tag latest

      - name: Attest the release assets
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ steps.assets.outputs.tarball }}
            ${{ steps.assets.outputs.sbom }}
            ${{ steps.assets.outputs.checksums }}
          create-storage-record: false

      - name: Export the provenance bundles and envelopes
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          TARBALL: ${{ steps.assets.outputs.tarball }}
          SBOM: ${{ steps.assets.outputs.sbom }}
          CHECKSUMS: ${{ steps.assets.outputs.checksums }}
          VERSION: ${{ steps.assets.outputs.version }}
        run: |
          for asset in "$TARBALL" "$SBOM" "$CHECKSUMS"; do
            node scripts/release-assets.mjs convert "$BUNDLE" "$asset" "$RUNNER_TEMP/release-assets"
          done
          node scripts/release-assets.mjs verify "$RUNNER_TEMP/release-assets" "$VERSION"

      - name: Transfer the verified release assets
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 7

  release-assets:
    needs: publish
    # Dispatch skips release-please; upload only after publish succeeds, even on that path.
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.publish.outputs.artifact_id }}
          path: ${{ runner.temp }}/release-assets/
          digest-mismatch: error

      - name: Verify and upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          node scripts/release-assets.mjs verify "$RUNNER_TEMP/release-assets" "$VERSION"
          for asset in "$RUNNER_TEMP/release-assets/memhtml-$VERSION.tgz" \
            "$RUNNER_TEMP/release-assets/memhtml-$VERSION.cyclonedx.json" \
            "$RUNNER_TEMP/release-assets/memhtml-$VERSION-SHA256SUMS"; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" \
              --bundle "$asset.sigstore.json" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-please.yml"
          done
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/release-assets/"* --repo "$GITHUB_REPOSITORY" --clobber
