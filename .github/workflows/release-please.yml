# Releases are cut by release-please from Conventional Commit subjects and published to
# npm by the publish job below, authenticated with OIDC trusted publishing — no npm token
# lives in any secret. RELEASING.md documents the flow, the bootstrap, and the failure
# signatures.
#
# One workflow, two jobs, on purpose: a second workflow keyed on `release: [published]`
# would never fire, because GitHub does not start workflow runs from events raised by the
# default GITHUB_TOKEN, and release-please tags with that token.
name: release-please

on:
  push:
    branches: [main]
  # Retry a publish against a tag that already exists. A publish can fail for a reason that
  # has nothing to do with the bytes — a missing tool on the runner did exactly that on the
  # first real release — and without this the only way to retry is to cut another version.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. memhtml-v0.2.0"
        required: true
        type: string

# Least privilege at the top, granted per job below. `id-token: write` in particular must
# never reach the release-please job — only the step that publishes needs an OIDC token.
permissions: {}

jobs:
  release-please:
    # Skipped on a manual dispatch: the tag already exists and nothing needs computing.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # One package at the repository root, so these are the plain single-package outputs.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # @v5, not the @v4 the action's own README still shows: v4 runs on the deprecated
      # node20 runtime. The version lives in fifteen places and release-please updates all
      # of them from this one root manifest: the root `package.json`, the twelve workspace
      # manifests through `json` extra-files, and the two source constants annotated with
      # `x-release-please-version` (apps/cli/src/commands.ts, apps/mcp/src/server.ts).
      # The workspace manifests still move even though none of them publishes and the
      # bundle carries none of them: it is bookkeeping, so a reader opening one sees which
      # release that code belongs to.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  publish:
    needs: release-please
    # `always()` so a manual dispatch runs it even though release-please was skipped.
    if: always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token npm exchanges for a short-lived publish credential. This is the
      # whole reason there is no NPM_TOKEN secret anywhere in this repo.
      id-token: write
    steps:
      # The TAG, not the branch: `main` has already moved on by the time this runs, and
      # the bytes that get published have to be the bytes that were released.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

      # The toolchain mise.lock pins, and this job genuinely needs it: `pnpm check` builds the
      # docs site, astro-d2 shells out to the `d2` binary, and d2 is a mise tool. Without this
      # the docs build dies in `astro:config:setup` and the release cannot publish — which is
      # exactly what happened on the first real release.
      #
      # BEFORE setup-node, and the order is load-bearing. Both prepend to PATH, so whichever
      # runs last wins, and setup-node's node is the one that must: it writes the OIDC .npmrc
      # and its npm is the one that has to run the publish.
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      # No `version:` — action-setup ERRORS when the workflow pins a version while
      # package.json's `packageManager` also pins one. That field is the single source of
      # truth, and it must be >= 11.1.3: earlier pnpm sends the literal
      # `${NODE_AUTH_TOKEN}` that setup-node writes as a bearer token and 404s before
      # OIDC can engage (pnpm#11513).
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # `registry-url` is what writes the .npmrc that scopes the registry, and OIDC never
      # engages without it.
      #
      # NODE_AUTH_TOKEN is deliberately NOT set — not even to an empty string. npm falls
      # back to OIDC only when no static credential resolves, and an empty string is
      # still a credential.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # Chrome's zygote sandbox needs unprivileged user namespaces, which the Ubuntu
      # 24.04 runner image restricts through AppArmor — same step as check.yml, same
      # reason: the a11y and budget gates drive a sandboxed headless Chrome.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The Playwright Chromium those gates drive; a no-op when the version is cached.
      - run: pnpm exec playwright install chromium --with-deps
        working-directory: apps/docs

      # The full gate again, on the tag. release-please opens its PR with the default
      # GITHUB_TOKEN, and GitHub starts no workflow runs from that token's events, so the
      # release PR itself runs NO CI. This step is the only gate on a release's contents.
      # Do not remove it to save minutes.
      - run: pnpm check

      # Assemble the one publishable package from the twelve workspace trees, then INSTALL
      # it and drive every subsystem through the installed binary. `pnpm check` proves the
      # workspace works and is structurally blind to what npm serves — three run-time
      # assets shipped broken under exactly that blindness. This is the only step whose
      # subject is the artifact.
      #
      # The pnpm script rather than the mise task, even though mise is present: the task is a
      # thin delegation to this script, and calling it directly keeps `npm` resolution in
      # setup-node's hands, which is the one that holds the OIDC `.npmrc`.
      - run: pnpm package:smoke

      # `npm publish`, not `pnpm publish`, and from the staging directory: the artifact is
      # already assembled with concrete dependency versions and no `workspace:`/`catalog:`
      # specifier left to rewrite, so pnpm's publish-time rewriting has nothing to do here.
      # pnpm 11's native publish also has open regressions ignoring publishConfig.access
      # (#11728) and publishConfig.registry (#11419).
      #
      # `--tag latest` explicitly rather than relying on `publishConfig`, and no
      # `--provenance`: trusted publishing generates the attestation automatically.
      - run: npm publish --tag latest
        working-directory: dist-package
