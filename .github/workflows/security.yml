# Dependency, SAST, and secret scanning, plus a separate Scorecard ratchet for pull requests.
#
# The scan job reports findings and fails only when a scanner produces no usable report.
# The Scorecard job gates each credited check against its floor and committed baseline.
#
# In the scan job, every scanner's findings exit code is swallowed in mise.toml, because a scanner that
# exits non-zero kills the step before the upload runs and throws away the finding detail that
# was the reason to scan — gating on findings happens through GitHub code scanning alerts and
# branch protection instead. What mise.toml does NOT swallow is a missing report: each scan
# deletes its SARIF first and then verifies it through scripts/verify-sarif.mjs, so a scanner
# that crashed, wrote a truncated file, or left a previous run's file on disk fails `mise run
# security` rather than reading as a clean sweep. That is why the upload below is
# `if: always()`: when one scanner's report is unusable the task exits non-zero, and the other
# four reports still belong in code scanning.
#
# Lefthook's pre-commit leak job and the separate Scorecard job both gate on findings:
# leaks must not become commits, and credited Scorecard checks must keep their floors.
#
# The scan job runs weekly as well as per-push: a lockfile that was clean when it merged does not
# stay clean, because the vulnerability database moves and the code does not.
name: security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "31 6 * * 2"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      # Full history: betterleaks sweeps every commit, and a shallow clone would scan a
      # single revision while reporting success.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - run: mise run security
      # One upload for the whole directory — each SARIF names its own tool, so code
      # scanning separates them without a step per scanner.
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: .sarif
      # The CycloneDX SBOM syft produced during `mise run security` (grype scanned the
      # same file, so the artifact and the scan describe one dependency set). 90 days
      # matches the advisory-response window this exists to serve: when a CVE drops,
      # the question "did we ship that?" is answered from here without a rebuild.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sbom-cyclonedx
          path: .sbom/sbom.cyclonedx.json
          retention-days: 90

  scorecard-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: --locked
      - run: mise run gate:scorecard
