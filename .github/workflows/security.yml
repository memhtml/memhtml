# Dependency, SAST, and secret scanning — kept out of check.yml so the gate stays one
# job with one meaning.
#
# Every scanner here REPORTS: each exits 0 and writes SARIF, and the gating happens
# through GitHub code scanning alerts and branch protection. A scanner that exits
# non-zero kills the step before the upload runs, which throws away the finding detail
# that was the reason to scan. The scanner that does gate is lefthook's pre-commit leak
# job, where blocking is the only useful outcome and there is no report to lose.
#
# Weekly schedule as well as per-push: a lockfile that was clean when it merged does not
# stay clean, because the vulnerability database moves and the code does not.
name: security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "31 6 * * 2"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      # Full history: betterleaks sweeps every commit, and a shallow clone would scan a
      # single revision while reporting success.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - run: mise run security
      # One upload for the whole directory — each SARIF names its own tool, so code
      # scanning separates them without a step per scanner.
      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always()
        with:
          sarif_file: .sarif
      # The CycloneDX SBOM syft produced during `mise run security` (grype scanned the
      # same file, so the artifact and the scan describe one dependency set). 90 days
      # matches the advisory-response window this exists to serve: when a CVE drops,
      # the question "did we ship that?" is answered from here without a rebuild.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sbom-cyclonedx
          path: .sbom/sbom.cyclonedx.json
          retention-days: 90
